# This workflow safely reproduces PyPI publish failures against TestPyPI with verbose upload logs.

name: Upload Package to TestPyPI on Demand

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build and upload (branch, tag, or commit SHA)
        required: true
        default: main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
    permissions:
      id-token: write # for PyPI's trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # aka v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.git_ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # aka v7.0.0
        with:
          python-version: 3.14
      - name: make_release
        run: |
          MAKE_RELEASE_PUBLISH=true MAKE_RELEASE_TESTPYPI=true ./.github-workflow-scripts/make_release.sh
